name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only PyTorch is much smaller than the default CUDA build
      - name: Install package (required dependencies only)
        run: |
          python -m pip install --upgrade pip
          pip install . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check import with required dependencies only
        run: python -c "import torchklip; from torchklip import io, plotting; print('OK')"

      - name: Install dev dependencies
        run: pip install ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest